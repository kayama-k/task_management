spring.application.name=backend

# H2 in-memory database (scaffold stage). Once PostgreSQL is available,
# replace this block with the postgresql driver + jdbc:postgresql:// URL
# per docs/requirements.md (10.3 - target: PostgreSQL).
spring.datasource.url=jdbc:h2:mem:taskmanagement
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# H2 web console, for inspecting the in-memory DB during development:
# http://localhost:8080/h2-console (JDBC URL above, user "sa", empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Expose full health details (including DB connectivity) at /actuator/health
management.endpoint.health.show-details=always
