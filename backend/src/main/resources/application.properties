spring.application.name=backend

# PostgreSQL (backend/compose.yaml).
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanagement
spring.datasource.username=taskmanagement
spring.datasource.password=taskmanagement
spring.datasource.driver-class-name=org.postgresql.Driver

# Entities (com.taskmanagement.backend.entity) define lists/cards; let
# Hibernate keep the schema in sync with them for now. A real migration
# tool (e.g. Flyway) is a candidate to replace this once the schema
# stabilizes.
spring.jpa.hibernate.ddl-auto=update

# data.sql(GET /api/lists 確認用のテストデータ)関連。defer-datasource-initialization
# でHibernateのスキーマ作成/更新を先に済ませてからdata.sqlを実行させる。PostgreSQLの
# ような非組み込みDBでは sql.init.mode を明示しないとdata.sqlがスキップされるため必須。
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
