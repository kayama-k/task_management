plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.taskmanagement'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Still no endpoints and no Actuator (not needed at this stage) — see
	// docs/requirements.md decision history. This step adds just enough to
	// connect to PostgreSQL (via Docker Compose, compose.yaml) over plain
	// JDBC. No JPA/entities yet: connectivity only, no tables.
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	runtimeOnly 'org.postgresql:postgresql'
	// Auto-starts/stops compose.yaml's postgres service alongside the app
	// (only active for local runs, e.g. `bootRun` — not packaged into the
	// production jar).
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
